[package]
name = "rusted-wm"
version = "0.1.0"
edition = "2024"

[dependencies]
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
smithay = { version = "0.7.0", default-features = false, features = ["backend_winit", "renderer_glow", "wayland_frontend", "desktop", "backend_drm", "backend_gbm", "backend_libinput", "backend_session_libseat", "backend_udev", "backend_egl", "xwayland"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
xcursor = "0.3.11"

[dev-dependencies]
tempfile = "3.27.0"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
