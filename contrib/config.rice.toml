# Ready-to-use rice config for rusted-wm. Copy to ~/.config/rusted-wm/config.toml:
#   mkdir -p ~/.config/rusted-wm ~/.config/waybar
#   cp contrib/config.rice.toml ~/.config/rusted-wm/config.toml
#   cp contrib/waybar/* ~/.config/waybar/
# Needs: pipewire + wireplumber (+ pipewire-pulse), waybar, mako, swaybg, foot, fuzzel; optional: grim + slurp (screenshots),
# swaylock + swayidle (lock/idle), cliphist + wl-clipboard (clipboard history),
# brightnessctl, playerctl.

# Started once, through `sh -c` (so $HOME works).
autostart = [
  # Audio daemons: nothing starts them on a bare TTY (KDE did it for you). Skipped when already running.
  "sh -c 'pgrep -x pipewire >/dev/null || pipewire'",
  "sh -c 'pgrep -x wireplumber >/dev/null || wireplumber'",
  "sh -c 'pgrep -x pipewire-pulse >/dev/null || pipewire-pulse'",
  "swaybg -c '#1e2030'",
  "waybar",
  "mako",
  "wl-paste --watch cliphist store",
  # lock after 5 min, switch screens... (needs swayidle + swaylock)
  # "swayidle -w timeout 300 'swaylock -f -c 000000'",
]

[general]
gap = 12
border = 2
modifier = "auto"   # super on a real session, alt when nested
# scale = 1.0

# Default programs: change them here and every bind that uses @name follows
# (mod+Enter = terminal, mod+d = launcher, mod+b = browser, mod+e = file manager, mod+shift+x = lock).
[apps]
terminal = "foot"
launcher = "fuzzel"
browser = "firefox"
file_manager = "dolphin"
lock = "swaylock -f -c 000000"

[audio]
step = 5
max_volume = 100
notify = true

[input]
# layout = "pl"     # keyboard layout: set this on a real TTY!
tap_to_click = true
natural_scroll = true

[keybinds]
# launchers (mod+d = @launcher, mod+shift+x = @lock are defaults; see [apps])
"mod+shift+d" = "spawn:wofi --show drun"
"mod+c" = "spawn:sh -c 'cliphist list | fuzzel --dmenu | cliphist decode | wl-copy'"
# window management extras
"mod+shift+q" = "close"
# screenshots (grim + slurp): region to clipboard, whole screen to ~/Pictures
"mod+shift+s" = "spawn:sh -c 'grim -g \"$(slurp)\" - | wl-copy'"
"Print" = "spawn:sh -c 'mkdir -p ~/Pictures && grim ~/Pictures/$(date +%F_%H-%M-%S).png'"
# brightness (volume + media keys are built in: see [audio] and the XF86Audio* defaults)
"XF86MonBrightnessUp" = "spawn:brightnessctl set 10%+"
"XF86MonBrightnessDown" = "spawn:brightnessctl set 10%-"
# multi-monitor: send the focused window to the monitor on the left/right
"mod+shift+comma" = "move-to-output-left"
"mod+shift+period" = "move-to-output-right"
